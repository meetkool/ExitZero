name: Build & Release APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      # ── Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Java (required for Android builds) ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Setup Flutter ──
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Install dependencies ──
      - name: Install dependencies
        run: flutter pub get

      # ── Build release APK ──
      - name: Build APK
        run: flutter build apk --release

      # ── Extract version from pubspec.yaml ──
      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "tag=v$VERSION-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION-$GITHUB_REF_NAME.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Rename APK with version ──
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/ExitZero-${{ steps.version.outputs.tag }}.apk

      # ── Create GitHub Release with the APK ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Without this the tag is created at the default branch head, so a
          # release built from another branch pointed at main's code.
          target_commitish: ${{ github.sha }}
          name: "ExitZero ${{ steps.version.outputs.tag }}"
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            🚀 **Automated release from `${{ github.ref_name }}`**

            **Commit:** ${{ github.sha }}
            **Build:** #${{ github.run_number }}

            ### Install
            Download the APK below and install on your Android device.
          files: build/app/outputs/flutter-apk/ExitZero-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
